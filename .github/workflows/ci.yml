name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
          TURSO_DATABASE_URL: file:ci.db
